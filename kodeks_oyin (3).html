<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kодекс: Стандартлар — O'quv O'yini</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Nunito:wght@400;600;700&display=swap');

  :root {
    --bg: #0d0f1a;
    --card: #151827;
    --card2: #1c2035;
    --border: #2a2f4a;
    --accent: #7c6af7;
    --accent2: #f7a26a;
    --green: #4ade80;
    --red: #f87171;
    --text: #e8eaf6;
    --muted: #8890b0;
    --glow: rgba(124,106,247,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── STARS BG ─── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(124,106,247,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(247,162,106,0.06) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 16px; }

  /* ─── HEADER ─── */
  header {
    padding: 28px 0 0;
    text-align: center;
  }
  .logo-title {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(1.2rem, 4vw, 1.9rem);
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }
  .logo-sub {
    color: var(--muted); font-size: 0.82rem; margin-top: 4px; letter-spacing: 1px;
  }

  /* ─── PROGRESS BAR ─── */
  .progress-section {
    margin: 22px 0 18px;
    background: var(--card); border-radius: 16px;
    padding: 18px 22px; border: 1px solid var(--border);
  }
  .progress-top {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
  }
  .progress-label { font-size: 0.82rem; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; }
  .progress-pct {
    font-family: 'Unbounded', sans-serif; font-size: 1.15rem; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .progress-bar-bg {
    height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
  }
  .stats-row { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .stat-pill {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 99px; padding: 5px 14px;
    font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 6px;
  }
  .stat-pill span { color: var(--text); font-weight: 700; }

  /* ─── CHAPTER GRID ─── */
  .section-title {
    font-family: 'Unbounded', sans-serif; font-size: 0.75rem;
    color: var(--muted); letter-spacing: 2px;
    margin: 24px 0 12px; text-transform: uppercase;
  }
  .chapter-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px; margin-bottom: 28px;
  }
  .chapter-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
    cursor: pointer; transition: all 0.2s;
    position: relative; overflow: hidden;
  }
  .chapter-card:hover {
    border-color: var(--accent); transform: translateY(-2px);
    box-shadow: 0 8px 24px var(--glow);
  }
  .chapter-card.done { border-color: rgba(74,222,128,0.35); }
  .chapter-card.done::after {
    content: '✓';
    position: absolute; top: 10px; right: 12px;
    color: var(--green); font-size: 1rem; font-weight: 700;
  }
  .chapter-card.active { border-color: var(--accent); background: var(--card2); }
  .chapter-num {
    font-family: 'Unbounded', sans-serif; font-size: 0.65rem;
    color: var(--accent); font-weight: 700; letter-spacing: 1px; margin-bottom: 5px;
  }
  .chapter-name { font-size: 0.82rem; font-weight: 600; line-height: 1.35; color: var(--text); }
  .chapter-status {
    margin-top: 8px; font-size: 0.72rem; color: var(--muted);
  }
  .chapter-status .score { color: var(--accent2); font-weight: 700; }

  /* ─── LESSON / QUIZ PANEL ─── */
  #panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 28px 28px 32px;
    margin-bottom: 40px; display: none;
  }
  #panel.visible { display: block; }

  .panel-header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
  }
  .panel-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; flex-shrink: 0;
  }
  .panel-title {
    font-family: 'Unbounded', sans-serif; font-size: 1rem; font-weight: 700;
    line-height: 1.3;
  }
  .panel-subtitle { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

  /* TABS */
  .tab-row { display: flex; gap: 8px; margin-bottom: 22px; }
  .tab-btn {
    padding: 8px 20px; border-radius: 99px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); font-family: 'Nunito', sans-serif;
    font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--accent); border-color: var(--accent);
    color: #fff; box-shadow: 0 4px 16px var(--glow);
  }
  .tab-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); }

  /* LESSON CONTENT */
  #lesson-content, #quiz-content { min-height: 180px; }

  .lesson-body {
    font-size: 0.93rem; line-height: 1.75; color: #d0d4f0;
  }
  .lesson-body h3 {
    font-family: 'Unbounded', sans-serif; font-size: 0.88rem;
    color: var(--accent2); margin: 18px 0 8px;
  }
  .lesson-body ul { padding-left: 20px; margin: 8px 0; }
  .lesson-body li { margin: 5px 0; }
  .lesson-body .highlight {
    background: rgba(124,106,247,0.12); border-left: 3px solid var(--accent);
    padding: 10px 14px; border-radius: 0 10px 10px 0; margin: 12px 0;
  }
  .lesson-body strong { color: var(--accent2); }

  /* QUIZ */
  .quiz-question {
    font-size: 1rem; font-weight: 700; line-height: 1.5;
    margin-bottom: 18px; color: var(--text);
  }
  .quiz-q-num {
    font-size: 0.72rem; color: var(--accent); font-weight: 700;
    letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase;
  }
  .options-list { display: flex; flex-direction: column; gap: 10px; }
  .opt-btn {
    background: var(--bg); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 13px 16px;
    text-align: left; color: var(--text); font-family: 'Nunito', sans-serif;
    font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.18s;
    line-height: 1.4;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--accent); background: var(--card2);
  }
  .opt-btn.correct { border-color: var(--green); background: rgba(74,222,128,0.1); color: var(--green); }
  .opt-btn.wrong   { border-color: var(--red);   background: rgba(248,113,113,0.1); color: var(--red); }

  .answer-feedback {
    margin-top: 14px; padding: 12px 16px; border-radius: 12px;
    font-size: 0.88rem; font-weight: 600; display: none;
    line-height: 1.5;
  }
  .answer-feedback.correct { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); color: var(--green); }
  .answer-feedback.wrong   { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--red); }

  .quiz-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 20px; flex-wrap: wrap; gap: 10px;
  }
  .quiz-progress-dots { display: flex; gap: 6px; }
  .q-dot {
    width: 8px; height: 8px; border-radius: 99px;
    background: var(--border); transition: all 0.2s;
  }
  .q-dot.done-correct { background: var(--green); }
  .q-dot.done-wrong   { background: var(--red); }
  .q-dot.current      { background: var(--accent); width: 20px; }

  /* BUTTONS */
  .btn {
    padding: 11px 24px; border-radius: 12px; border: none;
    font-family: 'Nunito', sans-serif; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; box-shadow: 0 4px 16px var(--glow);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px var(--glow); }
  .btn-secondary {
    background: var(--bg); border: 1.5px solid var(--border); color: var(--text);
  }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

  /* LOADER */
  .loader-wrap { display: flex; flex-direction: column; align-items: center; padding: 40px 0; gap: 14px; }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text { color: var(--muted); font-size: 0.85rem; }

  /* RESULT CARD */
  .result-card {
    text-align: center; padding: 32px 20px;
  }
  .result-emoji { font-size: 3.5rem; margin-bottom: 12px; }
  .result-score {
    font-family: 'Unbounded', sans-serif; font-size: 2.5rem; font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .result-msg { color: var(--muted); margin: 10px 0 22px; font-size: 0.95rem; }

  /* SCROLL TO PANEL */
  html { scroll-behavior: smooth; }

  @media (max-width: 600px) {
    #panel { padding: 18px 14px 22px; }
    .chapter-grid { grid-template-columns: 1fr 1fr; }
    .progress-section { padding: 14px 16px; }
  }
</style>
</head>

      <div id="quiz-result" style="display:none"></div>

</div>

- Rahbar yo'qligida ham barcha qoidalar ishlaydi`,
  15: `15-bob — Safar standartlari:

- Yig'ilish doim POZITIV kayfiyatda boshlanadi`,

  23: `23-bob — Ma'lumotlar va hujjatlarni saqlash:

- Dизайн fayllar PSD+CDR+JPG shaklida kanalga
- Hujjatlar kompyuter D-diskida va Telegram kanalda`,
  24: `24-bob — Moliya bo'limi standartlari:

- Pul sanab olish, 2 marta tekshirish SHART
- Didox platformasida 1 ish kunida imzolash
- Hodimlar "pul yo'q" emas, "berilmaydi" deydi`,
  25: `25-bob — Vazifa platformasi (Trello):
- Vazifa berilsa 5 soat ichida "Jarayon" ga o'tkaziladi
- Bajarilgandan keyin 10 daqiqa ichida "Bajarildi" ga
- Muddatni o'zgartirish — faqat RAHBAR
- Muddatni 1 soat avval uzaytirish so'raladi`,
  26: `26-bob — Onlayn ofis guruhi:
- Iş vaqtida doim FAOL bo'lish
- Kunlik reja soat 10:00 gacha yoziladi
- Guruhda tортишув — 1 oyga guruhdan chiqariladi
- Siyosiy va keraksiz material tashish — TAQIQ`,
  27: `27-bob — Bo'lim boshliqlari uchun standartlar:
- Qo'l ostidagi hodimlar kamchiliklari uchun JAVOBGAR
- Hodimni haqorat, urish — qat'iyan TAQIQ
- Imloviy xato bilan yozish — JARIMA
- Dam olish kunlari ham chaqirilishga tayyор bo'lish`,
  28: `28-bob — Media bo'limi standartlari:
- Mahsulot va xizmatlarni chiroyli suratga olish
- Mamnun mijozlar fikri video shaklida
- Har kuni sodda post (masala-savol shaklida)`,
  29: `29-bob — HR bo'limi standartlari:
- Har hodim uchun alohida HODIM PAPKASI
- Rekruter uchun oylik kontena reja
- Ota-ona bilan suhbat, mahalladan ma'lumotnoma
- Ишдан кетган hodim 8 kun ichida barcha guruhlardan chiqariladi`,
  30: `30-bob — Xayriya bo'limi:
- Xayriya faqat muhtoj va muhim joylarga
- Har bir oluvchi mahalla komitetidan surishtiriladi

  31: `31-bob — Hodim darajasi o'sishi:
- 1 yil ishlagan: yillik maoshning 5% qo'shiladi
- 2 yil ishlagan: 10% qo'shiladi
- 3 yil ishlagan: 15% qo'shiladi`,
  32: `32-bob — Ta'minot va hamkorlar:
- Har bir tovar bazaga shtrix-kod bilan kiritiladi

- Arzon lekin sifatli mahsulot tanlash SHART`,
  33: `33-bob — Shaxsiy yordamchi standartlari:

  34: `34-bob — Hodimlar aro kommunikasiya:
- Bir-biriga bogiiq ishlar YOZIB rasmiylashtiriladi
- "Kommunikasiya jurnali" — muddат + imzo
- Yordam berish uchun ЁЗМА ташаккурнома`,
  35: `35-bob — Direktor va boshqaruvchi standartlari:
- Direktor trelloni tartibli boshqaradi — 2 ish kunida tekshiradi
- Barcha doimiy vazifalar MA'SUL SHAXSGA bog'langan
- Direktor ham barcha qoidalarga bo'ysunadи
- Faoliyat boshida audio VADASHUV qilinadi`,
  36: `36-bob — Holding kompaniyalari:
- Bu kitobdagi standartlarning 80% boshqa kompaniyalarga ham mos
- Har bir biznes uchun qo'shimcha bob qo'shilishi mumkin
- Bir tizimda bir nechta korxonani boshqarish imkoni`
};

let state = JSON.parse(localStorage.getItem('kodeks_state') || 'null') || {
  done: {},       // { chapterNum: { score, total } }
  totalCorrect: 0,
  totalScore: 0
};

let currentChapter = null;
let currentTab = 'lesson';
let quizQuestions = [];
let qIndex = 0;
let qAnswered = [];
let lessonLoaded = {};
let quizLoaded = {};

function saveState() {
  localStorage.setItem('kodeks_state', JSON.stringify(state));
}

function renderChapters() {
  const grid = document.getElementById('chapter-grid');
  grid.innerHTML = '';
  CHAPTERS.forEach(ch => {
    const card = document.createElement('div');
    card.className = 'chapter-card' +
      (state.done[ch.num] ? ' done' : '') +
      (currentChapter === ch.num ? ' active' : '');
    const s = state.done[ch.num];
    card.innerHTML = `
      <div class="chapter-num">БОБ ${ch.num}</div>
      <div class="chapter-name">${ch.icon} ${ch.name}</div>
      <div class="chapter-status">${
        s ? `<span class="score">${s.score}/${s.total} to'g'ri</span>` : 'Boshlanmagan'
      }</div>`;
    card.onclick = () => openChapter(ch.num);
    grid.appendChild(card);
  });
}

function updateStats() {
  const done = Object.keys(state.done).length;
  const pct = Math.round(done / 36 * 100);
  document.getElementById('pct-text').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-correct').textContent = state.totalCorrect;
  document.getElementById('stat-score').textContent = state.totalScore;
}

function openChapter(num) {
  currentChapter = num;
  const ch = CHAPTERS.find(c => c.num === num);
  document.getElementById('panel-icon').textContent = ch.icon;
  document.getElementById('panel-title').textContent = ch.name;
  document.getElementById('panel-subtitle').textContent = `${num}-bob`;
  document.getElementById('panel').classList.add('visible');
  switchTab('lesson');
  renderChapters();
  setTimeout(() => document.getElementById('panel').scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (i===0 && tab==='lesson') || (i===1 && tab==='quiz'));
  });
  document.getElementById('lesson-content').style.display = tab === 'lesson' ? 'block' : 'none';
  document.getElementById('quiz-content').style.display = tab === 'quiz' ? 'block' : 'none';

  if (tab === 'lesson') loadLesson();
  if (tab === 'quiz') loadQuiz();
}

async function loadLesson() {
  if (lessonLoaded[currentChapter]) return;
  document.getElementById('lesson-loader').style.display = 'flex';
  document.getElementById('lesson-text').style.display = 'none';
  document.getElementById('lesson-actions').style.display = 'none';
  updateLoaderMsg();

  const ch = CHAPTERS.find(c => c.num === currentChapter);
  const rawData = CHAPTER_DATA[currentChapter] || ch.name;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: `Sen O'zbek biznes qo'llanmasi "Kodeks: Standartlar" kitobining ${currentChapter}-bobi bo'yicha o'qituvchisan.

Bob ma'lumotlari:
${rawData}

Quyidagi formatda FAQAT HTMLda qisqa va sodda dars yoz (Uzbek tilida):
- <h3>🔑 Asosiy g'oya</h3> — 2-3 gap
- <h3>📌 Asosiy qoidalar</h3> — 4-6 ta eng muhim qoida (bullet list)
- <div class="highlight">💡 Eslab qol</div> — 1 ta eng muhim fikr
- <h3>🌍 Amaliy misol</h3> — 1 ta oddiy real hayot misoli

HTML faqat yuqoridagi teglar, ul/li/strong/em ishlatish mumkin. Boshqa hech narsa yozma.`
        }]
      })
    });
    const data = await res.json();
    const html = data.content?.[0]?.text || '<p>Darsni yuklab bo\'lmadi.</p>';
    document.getElementById('lesson-text').innerHTML = html;
    lessonLoaded[currentChapter] = true;
  } catch (e) {
    document.getElementById('lesson-text').innerHTML = `<p style="color:var(--red)">Xatolik yuz berdi. Internet aloqasini tekshiring.</p>`;
  }

  document.getElementById('lesson-loader').style.display = 'none';
  document.getElementById('lesson-text').style.display = 'block';
  document.getElementById('lesson-actions').style.display = 'block';
}

async function loadQuiz() {
  if (quizLoaded[currentChapter]) { renderQuestion(); return; }
  document.getElementById('quiz-loader').style.display = 'flex';
  document.getElementById('quiz-main').style.display = 'none';
  document.getElementById('quiz-result').style.display = 'none';

  const ch = CHAPTERS.find(c => c.num === currentChapter);
  const rawData = CHAPTER_DATA[currentChapter] || ch.name;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1200,
        messages: [{
          role: 'user',
          content: `"Kodeks: Standartlar" ${currentChapter}-bobi bo'yicha 5 ta test savoli yarat.

Bob ma'lumotlari:
${rawData}

JSON FAQAT quyidagi formatda qaytara (Uzbek tilida, boshqa hech narsa):
[
  {
    "q": "Savol matni?",
    "opts": ["A variant", "B variant", "C variant", "D variant"],
    "ans": 0,
    "exp": "To'g'ri javobning qisqa izohi"
  }
]

ans = to'g'ri variantning indeksi (0,1,2 yoki 3). Faqat JSON, boshqa hech narsa.`
        }]
      })
    });
    const data = await res.json();
    let text = data.content?.[0]?.text || '[]';
    text = text.replace(/```json|```/g, '').trim();
    quizQuestions = JSON.parse(text);
    qIndex = 0;
    qAnswered = [];
    quizLoaded[currentChapter] = true;
  } catch (e) {
    quizQuestions = [];
    document.getElementById('quiz-loader').innerHTML = `<p style="color:var(--red);padding:20px">Test yuklanmadi. Keyinroq urinib ko'ring.</p>`;
    return;
  }

  document.getElementById('quiz-loader').style.display = 'none';
  document.getElementById('quiz-main').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  document.getElementById('quiz-loader').style.display = 'none';
  document.getElementById('quiz-result').style.display = 'none';
  document.getElementById('quiz-main').style.display = 'block';

  const q = quizQuestions[qIndex];
  document.getElementById('q-num').textContent = `SAVOL ${qIndex+1}/${quizQuestions.length}`;
  document.getElementById('q-text').textContent = q.q;

  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = () => answerQ(i);
    opts.appendChild(btn);
  });

  document.getElementById('q-feedback').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';

  // dots
  const dots = document.getElementById('q-dots');
  dots.innerHTML = '';
  quizQuestions.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'q-dot' + (i === qIndex ? ' current' : (qAnswered[i] !== undefined ? (qAnswered[i] ? ' done-correct' : ' done-wrong') : ''));
    dots.appendChild(d);
  });
}

function answerQ(chosen) {
  const q = quizQuestions[qIndex];
  const correct = chosen === q.ans;
  qAnswered[qIndex] = correct;

  document.querySelectorAll('.opt-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === q.ans) b.classList.add('correct');
    else if (i === chosen && !correct) b.classList.add('wrong');
  });

  const fb = document.getElementById('q-feedback');
  fb.className = 'answer-feedback ' + (correct ? 'correct' : 'wrong');
  fb.textContent = (correct ? '✅ To\'g\'ri! ' : '❌ Xato! ') + q.exp;
  fb.style.display = 'block';

  document.getElementById('next-btn').style.display = 'inline-flex';
  document.getElementById('next-btn').textContent = qIndex < quizQuestions.length - 1 ? 'Keyingi →' : '✅ Natijani ko\'r';
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= quizQuestions.length) { showResult(); return; }
  renderQuestion();
}

function showResult() {
  const correct = qAnswered.filter(Boolean).length;
  const total = quizQuestions.length;
  const pct = Math.round(correct / total * 100);
  const score = correct * 10;

  state.done[currentChapter] = { score: correct, total };
  state.totalCorrect += correct;
  state.totalScore += score;
  saveState();
  updateStats();
  renderChapters();

  const emoji = pct === 100 ? '🏆' : pct >= 60 ? '🎉' : '📚';
  const msg = pct === 100 ? 'Mukammal! Siz bu bobni to\'liq bilasiz!' :
              pct >= 80 ? 'Ajoyib natija! Deyarli to\'liq o\'zlashtirdingiz.' :
              pct >= 60 ? 'Yaxshi! Lekin bir marta qaytadan o\'qing.' :
              'Darsni qaytadan o\'qib, testni yangidan ishlang.';

  document.getElementById('quiz-main').style.display = 'none';
  const result = document.getElementById('quiz-result');
  result.style.display = 'block';
  result.innerHTML = `
    <div class="result-card">
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${correct}/${total}</div>
      <div class="result-msg">${msg}</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-secondary" onclick="retryQuiz()">🔄 Qayta ishlash</button>
        <button class="btn btn-primary" onclick="nextChapterAuto()">Keyingi bob →</button>
      </div>
    </div>`;
}

function retryQuiz() {
  quizLoaded[currentChapter] = false;
  qIndex = 0; qAnswered = [];
  loadQuiz();
}

function nextChapterAuto() {
  if (currentChapter < 36) openChapter(currentChapter + 1);
  else {
    document.getElementById('panel').classList.remove('visible');
    currentChapter = null;
    renderChapters();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

const loaderMsgs = [
  'AI dars tayyorlamoqda...',
  'Eng muhim qoidalar ajratilmoqda...',
  'Sodda va tushunarli qilib tayyorlanmoqda...',
  'Deyarli tayyor...'
];
let loaderIdx = 0;
function updateLoaderMsg() {
  const el = document.getElementById('loader-msg');
  if (!el) return;
  el.textContent = loaderMsgs[loaderIdx % loaderMsgs.length];
  loaderIdx++;
  if (document.getElementById('lesson-loader').style.display !== 'none')
    setTimeout(updateLoaderMsg, 1800);
}

// INIT
renderChapters();
updateStats();
</script>
</body>
</html>
