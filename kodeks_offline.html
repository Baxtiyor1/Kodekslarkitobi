<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kodeks: Standartlar — O'quv O'yini</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Nunito:wght@400;600;700&display=swap');
:root{--bg:#0d0f1a;--card:#151827;--card2:#1c2035;--border:#2a2f4a;--accent:#7c6af7;--accent2:#f7a26a;--green:#4ade80;--red:#f87171;--text:#e8eaf6;--muted:#8890b0;--glow:rgba(124,106,247,0.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(124,106,247,0.08) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 80%,rgba(247,162,106,0.06) 0%,transparent 60%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:0 16px}
header{padding:28px 0 0;text-align:center}
.logo-title{font-family:'Unbounded',sans-serif;font-size:clamp(1.1rem,4vw,1.8rem);font-weight:900;background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{color:var(--muted);font-size:.8rem;margin-top:4px;letter-spacing:1px}
.progress-section{margin:22px 0 18px;background:var(--card);border-radius:16px;padding:18px 22px;border:1px solid var(--border)}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progress-label{font-size:.82rem;color:var(--muted);font-weight:600;letter-spacing:.5px}
.progress-pct{font-family:'Unbounded',sans-serif;font-size:1.15rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.progress-bar-bg{height:10px;background:var(--bg);border-radius:99px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s cubic-bezier(.4,0,.2,1)}
.stats-row{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
.stat-pill{background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:5px 14px;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat-pill span{color:var(--text);font-weight:700}
.section-title{font-family:'Unbounded',sans-serif;font-size:.72rem;color:var(--muted);letter-spacing:2px;margin:24px 0 12px;text-transform:uppercase}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:28px}
.chapter-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.chapter-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px var(--glow)}
.chapter-card.done{border-color:rgba(74,222,128,.35)}
.chapter-card.done::after{content:'✓';position:absolute;top:10px;right:12px;color:var(--green);font-size:1rem;font-weight:700}
.chapter-card.active{border-color:var(--accent);background:var(--card2)}
.chapter-num{font-family:'Unbounded',sans-serif;font-size:.63rem;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:5px}
.chapter-name{font-size:.82rem;font-weight:600;line-height:1.35;color:var(--text)}
.chapter-status{margin-top:8px;font-size:.72rem;color:var(--muted)}
.chapter-status .score{color:var(--accent2);font-weight:700}
#panel{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 28px 32px;margin-bottom:40px;display:none}
#panel.visible{display:block}
.panel-header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.panel-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.panel-title{font-family:'Unbounded',sans-serif;font-size:1rem;font-weight:700;line-height:1.3}
.panel-subtitle{font-size:.8rem;color:var(--muted);margin-top:2px}
.tab-row{display:flex;gap:8px;margin-bottom:22px}
.tab-btn{padding:8px 20px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 16px var(--glow)}
.tab-btn:hover:not(.active){border-color:var(--accent);color:var(--text)}
.lesson-body{font-size:.93rem;line-height:1.8;color:#d0d4f0}
.lesson-body h3{font-family:'Unbounded',sans-serif;font-size:.85rem;color:var(--accent2);margin:18px 0 8px}
.lesson-body ul{padding-left:20px;margin:8px 0}
.lesson-body li{margin:6px 0}
.lesson-body .hl{background:rgba(124,106,247,.12);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;font-weight:600}
.lesson-body strong{color:var(--accent2)}
.lesson-actions{margin-top:20px}
.quiz-q-num{font-size:.72rem;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}
.quiz-question{font-size:1rem;font-weight:700;line-height:1.5;margin-bottom:18px;color:var(--text)}
.options-list{display:flex;flex-direction:column;gap:10px}
.opt-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;text-align:left;color:var(--text);font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .18s;line-height:1.4}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:var(--card2)}
.opt-btn.correct{border-color:var(--green);background:rgba(74,222,128,.1);color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:rgba(248,113,113,.1);color:var(--red)}
.answer-feedback{margin-top:14px;padding:12px 16px;border-radius:12px;font-size:.88rem;font-weight:600;display:none;line-height:1.5}
.answer-feedback.correct{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:var(--green)}
.answer-feedback.wrong{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red)}
.quiz-nav{display:flex;align-items:center;justify-content:space-between;margin-top:20px;flex-wrap:wrap;gap:10px}
.quiz-progress-dots{display:flex;gap:6px}
.q-dot{width:8px;height:8px;border-radius:99px;background:var(--border);transition:all .2s}
.q-dot.done-correct{background:var(--green)}
.q-dot.done-wrong{background:var(--red)}
.q-dot.current{background:var(--accent);width:20px}
.btn{padding:11px 24px;border-radius:12px;border:none;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 16px var(--glow)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px var(--glow)}
.btn-secondary{background:var(--bg);border:1.5px solid var(--border);color:var(--text)}
.btn-secondary:hover{border-color:var(--accent)}
.result-card{text-align:center;padding:32px 20px}
.result-emoji{font-size:3.5rem;margin-bottom:12px}
.result-score{font-family:'Unbounded',sans-serif;font-size:2.5rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-msg{color:var(--muted);margin:10px 0 22px;font-size:.95rem}
html{scroll-behavior:smooth}
@media(max-width:600px){#panel{padding:18px 14px 22px}.chapter-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo-title">📚 КОДЕКС: СТАНДАРТЛАР</div>
  <div class="logo-sub">Oflayn o'quv o'yini — internet shart emas</div>
</header>

<div class="progress-section">

    <div class="lesson-body" id="lesson-text"></div>

let state = JSON.parse(localStorage.getItem('kodeks_v2') || 'null') || { done:{}, totalCorrect:0, totalScore:0 };
let cur = null, curTab = 'lesson', qIdx = 0, qAnswered = [];

function save(){ localStorage.setItem('kodeks_v2', JSON.stringify(state)); }

function renderGrid(){
  const g = document.getElementById('chapter-grid'); g.innerHTML='';
  DATA.forEach(ch=>{
    const d = state.done[ch.num];
    const card = document.createElement('div');
    card.className='chapter-card'+(d?' done':'')+(cur===ch.num?' active':'');
    card.innerHTML=`<div class="chapter-num">БОБ ${ch.num}</div>
      <div class="chapter-name">${ch.icon} ${ch.name}</div>
      <div class="chapter-status">${d?`<span class="score">${d.score}/${d.total} to'g'ri</span>`:'Boshlanmagan'}</div>`;
    card.onclick=()=>openCh(ch.num);
    g.appendChild(card);
  });
}

function updateStats(){
  const done=Object.keys(state.done).length, pct=Math.round(done/36*100);
  document.getElementById('pct-text').textContent=pct+'%';
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('stat-done').textContent=done;
  document.getElementById('stat-correct').textContent=state.totalCorrect;
  document.getElementById('stat-score').textContent=state.totalScore;
}

function openCh(num){
  cur=num;
  const ch=DATA.find(c=>c.num===num);
  document.getElementById('panel-icon').textContent=ch.icon;
  document.getElementById('panel-title').textContent=ch.name;
  document.getElementById('panel-subtitle').textContent=num+'-bob';
  document.getElementById('panel').classList.add('visible');
  switchTab('lesson');
  renderGrid();
  setTimeout(()=>document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'start'}),80);
}

function switchTab(tab){
  curTab=tab;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&tab==='lesson')||(i===1&&tab==='quiz')));
  document.getElementById('lesson-content').style.display=tab==='lesson'?'block':'none';
  document.getElementById('quiz-content').style.display=tab==='quiz'?'block':'none';
  if(tab==='lesson') showLesson();
  if(tab==='quiz') startQuiz();
}

function showLesson(){
  const ch=DATA.find(c=>c.num===cur);
  document.getElementById('lesson-text').innerHTML=ch.lesson;
}

function startQuiz(){
  const ch=DATA.find(c=>c.num===cur);
  qIdx=0; qAnswered=[];
  document.getElementById('quiz-result').style.display='none';
  document.getElementById('quiz-main').style.display='block';
  renderQ();
}

function renderQ(){
  const ch=DATA.find(c=>c.num===cur), q=ch.quiz[qIdx];
  document.getElementById('q-num').textContent=`SAVOL ${qIdx+1}/${ch.quiz.length}`;
  document.getElementById('q-text').textContent=q.q;
  const opts=document.getElementById('q-options'); opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt-btn'; b.textContent=o;
    b.onclick=()=>answerQ(i); opts.appendChild(b);
  });
  document.getElementById('q-feedback').style.display='none';
  document.getElementById('next-btn').style.display='none';
  const dots=document.getElementById('q-dots'); dots.innerHTML='';
  ch.quiz.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='q-dot'+(i===qIdx?' current':(qAnswered[i]!==undefined?(qAnswered[i]?' done-correct':' done-wrong'):''));
    dots.appendChild(d);
  });
}

function answerQ(chosen){
  const ch=DATA.find(c=>c.num===cur), q=ch.quiz[qIdx], correct=chosen===q.ans;
  qAnswered[qIdx]=correct;
  document.querySelectorAll('.opt-btn').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.ans) b.classList.add('correct');
    else if(i===chosen&&!correct) b.classList.add('wrong');
  });
  const fb=document.getElementById('q-feedback');
  fb.className='answer-feedback '+(correct?'correct':'wrong');
  fb.textContent=(correct?'✅ To\'g\'ri! ':'❌ Xato! ')+q.exp;
  fb.style.display='block';
  const nb=document.getElementById('next-btn');
  nb.style.display='inline-flex';
  nb.textContent=qIdx<ch.quiz.length-1?'Keyingi →':'✅ Natijani ko\'r';
}

function nextQuestion(){
  const ch=DATA.find(c=>c.num===cur);
  qIdx++;
  if(qIdx>=ch.quiz.length){ showResult(); return; }
  renderQ();
}

function showResult(){
  const ch=DATA.find(c=>c.num===cur);
  const correct=qAnswered.filter(Boolean).length, total=ch.quiz.length;
  const pct=Math.round(correct/total*100), score=correct*10;
  if(!state.done[cur]){ state.totalCorrect+=correct; state.totalScore+=score; }
  state.done[cur]={score:correct,total}; save(); updateStats(); renderGrid();
  const emoji=pct===100?'🏆':pct>=60?'🎉':'📚';
  const msg=pct===100?'Mukammal! To\'liq o\'zlashtirdingiz!':pct>=80?'Ajoyib natija!':pct>=60?'Yaxshi, lekin bir marta qaytaring.':'Darsni qaytadan o\'qib, yangidan ishlang.';
  document.getElementById('quiz-main').style.display='none';
  const r=document.getElementById('quiz-result'); r.style.display='block';
  r.innerHTML=`<div class="result-card">
    <div class="result-emoji">${emoji}</div>
    <div class="result-score">${correct}/${total}</div>
    <div class="result-msg">${msg}</div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px">
      <button class="btn btn-secondary" onclick="startQuiz()">🔄 Qayta ishlash</button>
      ${cur<36?`<button class="btn btn-primary" onclick="openCh(${cur+1})">Keyingi bob →</button>`:'<button class="btn btn-primary" onclick="window.scrollTo({top:0,behavior:\'smooth\'})">🏠 Bosh sahifa</button>'}
    </div></div>`;
}

renderGrid(); updateStats();
</script>
